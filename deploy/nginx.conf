# /etc/nginx/sites-available/php2scan.example.ch
# nginx on the host terminates TLS and forwards to the php2scan container.

# extra rate limit in front of the app (the app has its own, stricter limits)
limit_req_zone $binary_remote_addr zone=php2scan_api:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=php2scan_page:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name php2scan.example.ch;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name php2scan.example.ch;

    ssl_certificate     /etc/letsencrypt/live/php2scan.example.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/php2scan.example.ch/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 4k;
    access_log off;                     # the app keeps its own audit log (30 days)

    location = /api/scan {
        limit_req zone=php2scan_api burst=3 nodelay;
        limit_req_status 429;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;     # the app uses this for limits/blocklists
        proxy_read_timeout 60s;
    }

    location / {
        limit_req zone=php2scan_page burst=20 nodelay;
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
